upstream chatwoot {
  server 127.0.0.1:3000;
}

# HTTP 服务器 - 重定向到 HTTPS
server {
  listen 80;
  server_name chat.trikn.shop;
  
  # Let's Encrypt 验证路径
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }
  
  # 其他所有请求重定向到 HTTPS
  location / {
    return 301 https://$server_name$request_uri;
  }
}

# HTTPS 服务器
server {
  listen 443 ssl http2;
  server_name chat.trikn.shop;

  # 文件上传大小限制
  client_max_body_size 50M;
  
  # SSL 证书路径（由 certbot 自动配置）
  ssl_certificate /etc/letsencrypt/live/chat.trikn.shop/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chat.trikn.shop/privkey.pem;
  
  # SSL 安全配置
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  
  # 安全头部
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # 主应用代理
  location / {
    proxy_pass http://chatwoot;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # 超时设置
    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
  }

  # WebSocket 支持（Chatwoot 实时通信）
  location /cable {
    proxy_pass http://chatwoot;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  
  # 静态资源缓存
  location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://chatwoot;
    proxy_cache_valid 200 1d;
    add_header Cache-Control "public, immutable";
  }
}
